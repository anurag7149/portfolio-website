<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8fa">
  <meta name="description" content="Anurag Yadav, Senior Visual Designer and UI/UX Designer in Gurugram. Branding, performance marketing, e-commerce, and thoughtful digital experiences.">
  <title>Page not found — Anurag Yadav</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    :root{--blue:#2554ed;--muted:#647084;color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;background:#f8f8fa;color:#171a21;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit;text-decoration:none}
    header{max-width:1320px;margin:0 auto;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .wordmark{font-size:27px;font-weight:750;letter-spacing:-.07em}
    header nav{display:flex;align-items:center;gap:24px;font-size:14px}
    .nav-resume{padding:11px 16px;border:1px solid #dce1e9;border-radius:999px}
    .not-found{min-height:80vh;display:grid;place-content:center;text-align:center;padding:80px 24px}
    .not-found strong{font-size:clamp(110px,23vw,260px);letter-spacing:-.08em;line-height:1;color:var(--blue)}
    .not-found h1{font-size:clamp(32px,5vw,64px);letter-spacing:-.045em;margin:22px 0 14px}
    .not-found p{font-size:18px;color:var(--muted);max-width:460px;margin:0 auto 30px}
    .not-found nav{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
    .not-found a{padding:15px 24px;border:1px solid var(--blue);border-radius:999px}
    .not-found a:first-child{background:var(--blue);color:white}
    @media(max-width:600px){header{padding:22px 20px}header nav{gap:14px;font-size:13px}.not-found{padding:64px 20px}}
  </style>
</head>
<body>
  <header>
    <a class="wordmark" data-site-path="" href="#" aria-label="Anurag Yadav home">anurag</a>
    <nav aria-label="Main navigation">
      <a data-site-path="portfolio/" href="#">Portfolio</a>
      <a data-site-path="about/" href="#">About me</a>
      <a class="nav-resume" data-site-path="assets/Anurag_Yadav_Resume.pdf" href="#" download>Résumé <span aria-hidden="true">↓</span></a>
    </nav>
  </header>
  <main class="not-found">
    <strong aria-hidden="true">404</strong>
    <h1>A little off the canvas.</h1>
    <p>This page has moved or doesn’t exist. Let’s get you back to the work.</p>
    <nav aria-label="Page recovery">
      <a data-site-path="" href="#">Back to home</a>
      <a data-site-path="portfolio/" href="#">Explore portfolio ↗</a>
    </nav>
  </main>
  <script>
    (function () {
      const pathname = window.location.pathname;
      const route = pathname.match(/\/(?:portfolio|about|connect)(?:\/|$)/);
      const segments = pathname.split("/").filter(Boolean);
      const siteRoot = route
        ? pathname.slice(0, route.index + 1)
        : pathname.endsWith("/404.html")
          ? pathname.slice(0, pathname.lastIndexOf("/") + 1)
          : segments.length > 1
            ? "/" + segments[0] + "/"
            : "/";
      document.querySelectorAll("[data-site-path]").forEach(function (link) {
        link.href = new URL(link.dataset.sitePath, new URL(siteRoot, window.location.href)).href;
      });
    })();
  </script>
</body>
</html>
